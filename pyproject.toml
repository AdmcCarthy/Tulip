[project]
name = "tulip"
version = "0.1.0"
description = "Tulip: a SubScout data story on the Norwegian continental shelf's remaining reserves over time"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
pipeline = [
    "requests>=2.31",
    "pandas>=2.2",
    "pyarrow>=16",
    "shapely>=2.0",
    "openpyxl>=3.1.5",
]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["scripts"]
