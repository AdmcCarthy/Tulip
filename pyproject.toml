[project]
name = "tulip"
version = "0.3.0"
description = "Tulip: a SubScout data story on the Norwegian continental shelf's remaining reserves over time"
requires-python = ">=3.12"
dependencies = [
    "subscout",
]

[dependency-groups]
pipeline = [
    "requests>=2.31",
    "pandas>=2.2",
    "pyarrow>=16",
    "shapely>=2.0",
    "openpyxl>=3.1.5",
]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.uv]
package = false

[tool.uv.sources]
subscout = { git = "https://github.com/AdmcCarthy/SubScout", tag = "v0.4.0" }

[tool.pytest.ini_options]
pythonpath = ["scripts"]
